networks:
  medianet:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}

services:
  # ============================================================
  # VPN Gateway
  # ============================================================
  gluetun:
    image: ${IMAGE_GLUETUN}
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    # Don't `cap_drop: ALL` — gluetun runs its main process as root (needed
    # for WireGuard interface setup) and relies on DAC_OVERRIDE to read the
    # bind-mounted /gluetun directory when the host dir is owned by PUID
    # with mode 750. Dropping all caps strips DAC_OVERRIDE and the container
    # exits at startup with "open /gluetun/servers.json: permission denied".
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - medianet
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT_QBITTORRENT}:8080"       # qBittorrent WebUI
      - "${HOST_BIND:-127.0.0.1}:${PORT_SABNZBD}:8081"           # SABnzbd WebUI
      - "6881:6881/tcp"                   # Torrent listening
      - "6881:6881/udp"
      - "${HOST_BIND:-127.0.0.1}:${PORT_GLUETUN_CONTROL}:8000"   # Gluetun control API
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_MTU=${WIREGUARD_MTU:-1420}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - FIREWALL_VPN_INPUT_PORTS=${FIREWALL_VPN_INPUT_PORTS}
      - FIREWALL_OUTBOUND_SUBNETS=${DOCKER_SUBNET},${LOCAL_SUBNET}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UPDATER_PERIOD=24h
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"basic","username":"mmc","password":"${GLUETUN_CONTROL_PASSWORD:-changeme}"}
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --user mmc --password '${GLUETUN_CONTROL_PASSWORD:-changeme}' http://localhost:8000/v1/vpn/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ============================================================
  # Download Clients
  # ============================================================
  qbittorrent:
    image: ${IMAGE_QBITTORRENT}
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  sabnzbd:
    image: ${IMAGE_SABNZBD}
    container_name: sabnzbd
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  unpackerr:
    image: ${IMAGE_UNPACKERR}
    container_name: unpackerr
    networks:
      - medianet
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${UN_SONARR_0_API_KEY:-}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${UN_RADARR_0_API_KEY:-}
      - UN_SONARR_0_PATHS_0=/data/torrents/tv
      - UN_SONARR_0_PATHS_1=/data/usenet/tv
      - UN_RADARR_0_PATHS_0=/data/torrents/movies
      - UN_RADARR_0_PATHS_1=/data/usenet/movies
    volumes:
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ============================================================
  # Indexer & Media Managers
  # ============================================================
  prowlarr:
    image: ${IMAGE_PROWLARR}
    container_name: prowlarr
    networks:
      - medianet
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT_PROWLARR}:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  flaresolverr:
    image: ${IMAGE_FLARESOLVERR}
    container_name: flaresolverr
    # Shares gluetun's network namespace so Cloudflare challenges are solved
    # from the VPN exit IP, not the host's. Without this, every tracker
    # Prowlarr queries would see the real home IP — correlating it with the
    # exact indexers in use — even though the downloads themselves tunnel.
    # Also inherits the kill-switch: no route out if the tunnel drops.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=${TZ}
      - BROWSER_TIMEOUT=40000
    # Headless Chromium spikes hard per challenge. Cap it so a runaway solve
    # can't starve the rest of the stack.
    mem_limit: 768m
    # Deliberately no `ports:` — the 8191 API lives inside gluetun's netns and
    # is reachable only container-to-container at http://gluetun:8191.
    # Publishing it would expose an open proxy to the LAN.
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  sonarr:
    image: ${IMAGE_SONARR}
    container_name: sonarr
    networks:
      - medianet
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT_SONARR}:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  radarr:
    image: ${IMAGE_RADARR}
    container_name: radarr
    networks:
      - medianet
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT_RADARR}:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ============================================================
  # Media Server & Companions
  # ============================================================
  bazarr:
    image: ${IMAGE_BAZARR}
    container_name: bazarr
    networks:
      - medianet
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT_BAZARR}:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}/media:/data/media
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ============================================================
  # Request Management
  # ============================================================
  seerr:
    image: ${IMAGE_SEERR}
    container_name: seerr
    networks:
      - medianet
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT_SEERR}:5055"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ============================================================
  # Operations
  # ============================================================
  recyclarr:
    image: ${IMAGE_RECYCLARR}
    container_name: recyclarr
    networks:
      - medianet
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: ${IMAGE_WATCHTOWER}
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      # On-demand only. Every image in this stack is pinned to an explicit
      # tag, so a scheduled sweep could never bump anything — it only ever
      # re-pulled the same digest. Updates are now driven from the UI, which
      # POSTs to the API below after writing the new tag to .env.
      - WATCHTOWER_HTTP_API_UPDATE=true
      # Not guarded with `:?`. A missing updater secret must not stop Sonarr,
      # Radarr and qBittorrent from starting — that is the same over-coupling
      # that let a NAS blip take down the dashboard. deploy.sh generates the
      # token on migrate; if it is somehow still blank, Watchtower runs
      # without its API and the UI reports the update button as unavailable.
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:-}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=mars-media-centre
      - DOCKER_API_VERSION=1.44
    networks:
      - medianet
    restart: unless-stopped

  # ============================================================
  # Unified Web UI
  # ============================================================
  media-ui:
    # Pre-built by CI and pulled from GHCR — the production host does not
    # compile anything. Building here used to mean stopping the running
    # container first, then risking an OOM or a flaky npm registry with no
    # image left to roll back to.
    #
    # To build from source instead (local development, or if GHCR is
    # unreachable):  docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build media-ui
    image: ${IMAGE_MEDIA_UI:-ghcr.io/marioalfaro75/mmc-media-ui:latest}
    container_name: media-ui
    networks:
      - medianet
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT_UI}:3000"
    extra_hosts:
      # Resolve host.docker.internal to the host on bare-metal Linux so the
      # PLEX_URL default ({...}:host.docker.internal:32400) reaches host Plex.
      - "host.docker.internal:host-gateway"
    environment:
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - QBITTORRENT_URL=http://gluetun:8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-}
      - USE_QBITTORRENT=${USE_QBITTORRENT:-on}
      - SABNZBD_URL=http://gluetun:8081
      - SABNZBD_API_KEY=${SABNZBD_API_KEY:-}
      - USE_SABNZBD=${USE_SABNZBD:-off}
      - PLEX_URL=${PLEX_URL:-http://host.docker.internal:32400}
      - SEERR_URL=http://seerr:5055
      - SEERR_API_KEY=${SEERR_API_KEY:-}
      - BAZARR_URL=http://bazarr:6767
      - BAZARR_API_KEY=${BAZARR_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - GLUETUN_URL=http://gluetun:8000
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR}
      - ENV_FILE_PATH=${HOST_PROJECT_DIR}/.env
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MMC_API_KEY=${MMC_API_KEY:-}
      - GLUETUN_CONTROL_PASSWORD=${GLUETUN_CONTROL_PASSWORD:-changeme}
      - HTTPS_ONLY=${HTTPS_ONLY:-0}
      - DATA_ROOT=${DATA_ROOT}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Host path of ~/.mmc/logs — used by /api/updates/apply so the
      # updater sidecar writes logs visible to both the host and media-ui.
      - MMC_HOST_LOGS_DIR=${HOME}/.mmc/logs
    volumes:
      - ./:${HOST_PROJECT_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_ROOT}:${CONFIG_ROOT}
      - ${DATA_ROOT}:${DATA_ROOT}
      - ${BACKUP_DIR}:${BACKUP_DIR}
      - ${HOME}/.mmc/logs:/app/logs
      - ${HOME}/.mmc/scripts:/app/scripts
    depends_on:
      - sonarr
      - radarr
      - prowlarr
    restart: unless-stopped
    labels:
      # Watchtower performs the pull-and-recreate when you click Update, so
      # media-ui never has to operate on itself. It cannot: a container
      # cannot recreate the container it is running in, which is why this
      # used to need a detached sidecar.
      - com.centurylinklabs.watchtower.enable=true
