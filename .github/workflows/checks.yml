name: Checks

# The single definition of "is this commit good enough to ship". Called by
# ci.yml on every push/PR, and by both release paths before they publish an
# image — so a `v*` tag can't reach `:latest` without clearing the same bar
# that a pull request does.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: bash -n all scripts
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render .env from example
        run: |
          cp .env.example .env
          # docker compose needs HOST_PROJECT_DIR to interpolate the media-ui bind mount.
          sed -i "s|^HOST_PROJECT_DIR=.*|HOST_PROJECT_DIR=$PWD|" .env
      - name: Validate base compose
        run: docker compose -f docker-compose.yml config -q
      - name: Validate with NAS override (synthetic)
        run: |
          cat > docker-compose.nas.override.yml <<'YAML'
          volumes:
            nas:
              driver: local
              driver_opts:
                type: cifs
                o: username=guest,password=,vers=3.0
                device: //example.lan/share
          services:
            sonarr:
              volumes:
                - nas:/data
          YAML
          docker compose -f docker-compose.yml -f docker-compose.nas.override.yml config -q

  ui:
    name: UI typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      # No lint step: ESLint has never been configured here, so `next lint`
      # drops into an interactive setup prompt. Wiring it up means triaging
      # whatever it flags across the existing codebase — worth doing, but not
      # as a side effect of the release-pipeline change.
      - name: Unit tests
        run: npm test
      - name: Production build
        # The release path publishes an image built from this same source; if
        # `next build` can't complete here, publishing must not proceed.
        run: npm run build
      - name: Critical production CVEs (blocking)
        # Only critical-severity prod advisories fail CI — there's currently
        # no clean fix path for the high-level Next.js advisories without a
        # major upgrade. Run the high-level audit separately below so the
        # output is visible without gating every PR on it.
        run: npm audit --omit=dev --audit-level=critical
      - name: High production CVEs (informational)
        run: npm audit --omit=dev --audit-level=high || true

  systemd:
    name: systemd unit syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render and verify mmc.service
        run: |
          mkdir -p /tmp/units
          sed -e "s|__PROJECT_DIR__|$PWD|g" -e "s|__USER__|runner|g" \
            scripts/mmc.service > /tmp/units/mmc.service
          systemd-analyze verify /tmp/units/mmc.service
