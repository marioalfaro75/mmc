name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Newer pushes on the same ref supersede in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The lint/type/test/audit bar lives in checks.yml so the release paths run
  # exactly the same jobs before they publish an image.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  # On a green push to main, publish the rolling `edge` tag plus an immutable
  # `sha-<short>` for pinning and rollback. `:latest` and the semver tags stay
  # reserved for cut releases — a deliberate act, not a side effect of merging.
  publish-edge:
    name: Publish mmc-media-ui (edge)
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mmc-media-ui
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ui
          build-args: |
            MMC_VERSION=${{ steps.meta.outputs.version }}
          push: true
          # amd64 only. Building arm64 means emulating it through QEMU,
          # which turned a ~4 min build into ~20 — a real cost on every
          # release for an architecture nothing here runs on. Add
          # linux/arm64 back (with setup-qemu-action) if this ever needs
          # to run on a Pi or an ARM server.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
